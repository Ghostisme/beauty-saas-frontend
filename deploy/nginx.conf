# ═══════════════════════════════════════════════════════════════════════
#  前端容器内部的 nginx 配置
#
#  这一层只做两件事：托管 SPA 静态文件、把 /api 转给后端容器。
#  TLS、HSTS、域名、证书全部由宿主机 nginx 处理，这里一概不碰 ——
#  容器内是纯 HTTP，监听 8080，由 compose 映射到宿主 127.0.0.1:19180。
#
#  为什么前端也要容器化：本次部署要求前后端各占一个独立端口。
#  静态文件如果由宿主 nginx 直接 root，前端就不占任何端口了。
#  顺带的好处是宿主 nginx 不再需要读 /opt/beauty-saas 下的文件，
#  省掉了给 www-data 配目录遍历 ACL 那一步（少一个 403 的坑）。
# ═══════════════════════════════════════════════════════════════════════

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ── 后端 API ────────────────────────────────────────────────────
    #  走 Docker 内部网络用容器名直连，不经过宿主机端口。
    #
    #  ⚠️ resolver 和变量式 proxy_pass 是刻意的：nginx 默认在启动时就解析
    #     upstream 主机名，如果那一刻 backend 容器还没起来，nginx 会直接
    #     启动失败并反复重启。用变量能推迟到每次请求时才解析，后端慢启动
    #     期间前端页面照常能打开（API 请求返回 502，前端有错误提示）。
    #     127.0.0.11 是 Docker 内置 DNS 的固定地址。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream "http://beauty-saas-backend:8080";

    location /api/ {
        # 后端 application.yml 设了 context-path: /api，前端请求路径也带 /api，
        # 两边前缀对齐，所以原样透传、不做 rewrite
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 宿主 nginx 已经填过一次，这里用 add_x_forwarded_for 追加而不是覆盖，
        # 才能让后端看到真实的客户端 IP 而不是 Docker 网关地址
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        # 留足余量等 Spring 冷启动 + Flyway 迁移；正常请求远快于此
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 容器健康检查专用 ────────────────────────────────────────────
    #  独立于业务路由：后端挂了它也该返回 200，否则 autoheal 会去重启
    #  一个其实完好的前端容器
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── 隐藏文件一律不对外 ──────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── 带 hash 的构建产物：长缓存 ──────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA history fallback ────────────────────────────────────────
    #  index.html 绝不能缓存：它引用带 hash 的资源名，一旦被浏览器或中间层
    #  缓存住，发版后用户会继续请求已不存在的旧 hash 文件，表现是白屏，
    #  而且刷新也好不了。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
